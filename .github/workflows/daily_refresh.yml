name: Daily MLS Value Index refresh

on:
  schedule:
    # 13:15 UTC ≈ 06:15 America/Los_Angeles (standard time)
    - cron: "15 13 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("yaml","jsonlite","dplyr","tidyr","readr","tibble","purrr","DBI","RSQLite","openxlsx","here"), repos="https://cloud.r-project.org")'
          Rscript -e 'if (!requireNamespace("itscalledsoccer", quietly=TRUE)) install.packages("itscalledsoccer", repos="https://cloud.r-project.org")'

      - name: Refresh ASA/MLSPA and rebuild scores
        run: Rscript scripts/refresh_daily.R

      - name: Commit updated processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/* and exports/* are gitignored locally; force-add so Actions can persist refreshes
          git add -f data/processed data/interim exports 2>/dev/null || true
          git add -f database/mls_value_index.sqlite 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily Value Index data refresh"
            git push
          fi

      - name: Deploy to shinyapps.io (optional)
        if: ${{ secrets.SHINYAPPS_TOKEN != '' && secrets.SHINYAPPS_SECRET != '' }}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
        run: |
          Rscript -e 'install.packages("rsconnect", repos="https://cloud.r-project.org")'
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appDir = ".",
              appName = "mls-value-index",
              launch.browser = FALSE,
              forceUpdate = TRUE
            )
          '
