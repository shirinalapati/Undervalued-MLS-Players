default:
  project:
    name: "2026 MLS Value Index"
    mode: "live"                    # demo | live
    product_season: 2026
    evaluation_period_default: "blended"  # ytd_2026 | full_2025 | blended
    random_seed: 42
    min_minutes_ytd: 180
    min_minutes_full: 450
    min_minutes_official: 450
    blend:
      prior_strength_minutes: 700
      min_ytd_share: 0.15
      max_ytd_share: 0.90

  paths:
    raw: "data/raw"
    interim: "data/interim"
    processed: "data/processed"
    external: "data/external"
    demo: "data/external/demo"
    database: "database/mls_value_index.sqlite"
    exports: "exports"
    cache: "data/raw/cache"
    provenance: "data/processed/data_provenance.json"

  database:
    backend: "sqlite"

  acquisition:
    asa:
      leagues: ["mls"]
      seasons: [2024, 2025, 2026]
      salary_season: 2026
      pause_seconds: 1.2
      cache_hours: 12
    include_elite_leagues: false

  deployment:
    auto_reload: true
    refresh_check_seconds: 60
    # Shown in the app banner after performance cutoff, e.g. "(updates every day)"
    refresh_cadence_label: "every day"
    daily_refresh_script: "scripts/refresh_daily.R"
    # Scheduled refresh rebuilds ASA/MLSPA data + Value Index scores in place.
    # App hot-reloads processed files when mtimes change (local/server with persistent disk).
    # On shinyapps.io, use GitHub Actions daily refresh + redeploy (see docs/deployment.md).

  labels:
    ytd_2026: "2026 season-to-date"
    full_2025: "2025 full season"
    blended: "2025+2026 season to date"
